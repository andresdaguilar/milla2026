:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2129; --line:#272e38;

  --ac:#f0883e; --ac2:#ffb86b; --ok:#3fb950; --hard:#f85149; --cool:#58a6ff; --violet:#bc8cff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);

  font-size:16px;line-height:1.5;padding-bottom:80px}
.wrap{max-width:840px;margin:0 auto;padding:0 14px}

header{background:linear-gradient(180deg,#161b22,#0d1117);border-bottom:1px solid var(--line);
  padding:16px 0 12px;position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em}
h1 span{color:var(--ac)}
.count{text-align:right;font-size:11px;color:var(--tx3);line-height:1.35}
.count b{display:block;font-size:19px;color:var(--tx);font-variant-numeric:tabular-nums}

nav{display:flex;gap:6px;margin:14px 0 4px}
nav button{flex:1;background:var(--bg2);color:var(--tx2);border:1px solid var(--line);
  padding:11px 8px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
nav button.on{background:var(--ac);color:#1a1005;border-color:var(--ac)}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card.today{border-color:var(--ac);box-shadow:0 0 0 1px rgba(240,136,62,.25)}
.date{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;margin:0 6px 8px 0;background:var(--bg3);color:var(--tx2);border:1px solid var(--line)}
.tag.q{background:rgba(248,81,73,.14);color:#ff8880;border-color:rgba(248,81,73,.35)}
.tag.e{background:rgba(88,166,255,.13);color:#79b8ff;border-color:rgba(88,166,255,.3)}
.tag.t{background:rgba(188,140,255,.14);color:#d2b3ff;border-color:rgba(188,140,255,.35)}
.tag.r{background:rgba(63,185,80,.13);color:#56d364;border-color:rgba(63,185,80,.3)}
.tag.done{background:rgba(63,185,80,.16);color:#56d364;border-color:rgba(63,185,80,.4)}
.sesion{font-size:20px;font-weight:700;line-height:1.3;margin:4px 0 2px}
.card.today .sesion{font-size:23px}
.sub{color:var(--tx2);font-size:14px;margin-top:8px}

h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);
  margin:18px 0 8px;font-weight:800;border-top:1px solid var(--line);padding-top:14px}
h3:first-of-type{border-top:0;padding-top:0}
.obj{background:var(--bg3);border-left:3px solid var(--ac);padding:11px 13px;border-radius:0 8px 8px 0;
  font-size:15px;color:var(--tx)}
ol.pasos{margin:0;padding-left:20px}
ol.pasos li{margin:7px 0;font-size:15px}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 11px;
  margin:6px 0;font-size:14px;font-variant-numeric:tabular-nums}
.crit{background:rgba(63,185,80,.09);border:1px solid rgba(63,185,80,.3);border-radius:8px;
  padding:11px 13px;font-size:14px}
.crit b{color:var(--ok)}
.warn{background:rgba(248,81,73,.09);border:1px solid rgba(248,81,73,.28);border-radius:8px;
  padding:9px 12px;margin:6px 0;font-size:14px}
.gym{background:rgba(188,140,255,.08);border:1px solid rgba(188,140,255,.25);border-radius:8px;
  padding:11px 13px;font-size:14px;white-space:pre-wrap}
.nota{font-size:14px;color:var(--tx2);white-space:pre-wrap}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:7px;margin-top:4px}
.stat{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}

.wk{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--bg2)}
.wk>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;justify-content:space-between;
  align-items:center;gap:10px;background:var(--bg2)}
.wk>summary::-webkit-details-marker{display:none}
.wk[open]>summary{border-bottom:1px solid var(--line)}
.wkn{font-weight:700;font-size:15px}
.wkf{font-size:11px;color:var(--tx3);margin-top:2px;line-height:1.35}
.wkv{font-size:12px;color:var(--ac2);font-weight:700;white-space:nowrap}
.wk.now>summary{background:rgba(240,136,62,.1)}

.day{border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day>summary{list-style:none;cursor:pointer;padding:11px 15px;display:flex;gap:10px;align-items:baseline}
.day>summary::-webkit-details-marker{display:none}
.day>summary:hover{background:var(--bg3)}
.dd{font-size:11px;color:var(--tx3);width:74px;flex:none;font-variant-numeric:tabular-nums}
.ds{font-size:14px;flex:1;line-height:1.35}
.dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px;background:var(--tx3)}
.dot.q{background:var(--hard)}.dot.e{background:var(--cool)}.dot.t{background:var(--violet)}.dot.r{background:var(--ok)}
.dbody{padding:4px 15px 18px;background:var(--bg)}
.day.hoy>summary{background:rgba(240,136,62,.14);border-left:3px solid var(--ac)}
.chk{color:var(--ok);font-size:12px;flex:none}

.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--tx3);margin:8px 2px 0}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
footer{color:var(--tx3);font-size:11px;text-align:center;padding:26px 0 10px;line-height:1.6}
.ref{display:grid;grid-template-columns:1fr;gap:0}
.ref div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.ref div:first-child{border-top:0}
.ref span:first-child{color:var(--tx2)}
.ref span:last-child{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.hide{display:none}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('plan-data').textContent);
const HOY = new Date(); HOY.setHours(0,0,0,0);
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const HOY_ISO = iso(HOY);
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function kind(t){ t=(t||'').toUpperCase();
  if(t.includes('CARRERA'))return'r'; if(t.includes('TEST'))return't';
  if(/UMBRAL|VO2|ESPEC|VELOCIDAD|ACTIVAC/.test(t))return'q';
  if(t.includes('DESCANSO'))return''; return'e'; }

const allDays=[]; DATA.semanas.forEach(s=>s.dias.forEach(d=>{d._sem=s;allDays.push(d)}));

// countdown
const carrera=new Date(DATA.meta.fecha_carrera+'T00:00:00');
document.getElementById('dias').textContent=Math.max(0,Math.round((carrera-HOY)/864e5));
document.getElementById('gen').textContent='Datos al '+DATA.meta.generado;

function guiaHTML(g,d){
  if(!g) return '';
  let h='';
  if(g.objetivo) h+=`<h3>Objetivo</h3><div class="obj">${esc(g.objetivo)}</div>`;
  if(g.pasos&&g.pasos.length) h+=`<h3>Cómo ejecutarla</h3><ol class="pasos">${g.pasos.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>`;
  if(g.ritmos&&g.ritmos.length) h+=`<h3>Ritmos de referencia</h3><ul class="plain">${g.ritmos.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
  if(g.criterio) h+=`<h3>Criterio de sesión bien hecha</h3><div class="crit">${esc(g.criterio)}</div>`;
  if(g.avisos&&g.avisos.length) h+=`<h3>Atención</h3>${g.avisos.map(p=>`<div class="warn">${esc(p)}</div>`).join('')}`;
  if(d.gym) h+=`<h3>Gimnasio</h3><div class="gym">${esc(d.gym)}</div>`;
  if(d.sesion_pm) h+=`<h3>Segunda sesión (PM)</h3><div class="nota">${esc(d.sesion_pm)}</div>`;
  if(d.nota_plan) h+=`<h3>Nota del plan</h3><div class="nota">${esc(d.nota_plan)}</div>`;
  return h;
}
function registroHTML(d){
  if(!d.hecho&&!d.km) return '';
  const st=[['km',d.km],['tiempo',d.tiempo],['ritmo',d.ritmo],['FC med',d.fc_media],['FC máx',d.fc_max],['peso',d.peso]]
    .filter(x=>x[1]!=null&&x[1]!=='')
    .map(x=>`<div class="stat"><b>${esc(x[1])}</b><span>${x[0]}</span></div>`).join('');
  let h=`<h3>Registro</h3>`;
  if(d.hecho) h+=`<div class="tag done">${esc(d.hecho)}</div>`;
  if(st) h+=`<div class="stats">${st}</div>`;
  if(d.notas) h+=`<div class="nota" style="margin-top:10px">${esc(d.notas)}</div>`;
  return h;
}

// ---------- TAB HOY ----------
function renderHoy(){
  let d=allDays.find(x=>x.fecha_iso===HOY_ISO);
  let aviso='';
  if(!d){ d=allDays.find(x=>x.fecha_iso>HOY_ISO);
    aviso=d?`<div class="warn">Hoy (${HOY_ISO}) está fuera del plan. Se muestra el próximo día programado.</div>`:'';
    if(!d) d=allDays[allDays.length-1]; }
  const k=kind(d.tipo);
  const fecha=new Date(d.fecha_iso+'T00:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  let h=aviso+`<div class="card today">
    <div class="date">${esc(fecha)} · ${esc(d._sem.numero?('Semana '+d._sem.numero):'')} · ${esc(d._sem.volumen||'')}</div>
    <span class="tag ${k}">${esc(d.tipo||'—')}</span>
    <div class="sesion">${esc(d.sesion||'—')}</div>
    ${guiaHTML(d.guia,d)}
    ${registroHTML(d)}
  </div>`;

  // resto de la semana
  const otros=d._sem.dias.filter(x=>x!==d);
  h+=`<div class="card"><div class="date">Resto de la semana ${d._sem.numero} · ${esc(d._sem.fase||'')}</div>`;
  h+=otros.map(x=>`<details class="day"><summary><span class="dot ${kind(x.tipo)}"></span>
      <span class="dd">${esc((x.dia||'').slice(0,3))} ${esc((x.fecha||'').slice(0,5))}</span>
      <span class="ds">${esc(x.sesion||'—')}</span>${x.hecho?'<span class="chk">✓</span>':''}</summary>
      <div class="dbody">${guiaHTML(x.guia,x)}${registroHTML(x)}</div></details>`).join('');
  h+=`</div>`;

  // referencias
  h+=`<div class="card"><div class="date">Referencias medidas</div><div class="ref">`+
    Object.entries(DATA.meta.referencias).map(([k2,v])=>`<div><span>${esc(k2)}</span><span>${esc(v)}</span></div>`).join('')+
    `</div><h3>Tests</h3><div class="ref">`+
    DATA.meta.tests.map(t=>{const dd=Math.round((new Date(t.fecha+'T00:00:00')-HOY)/864e5);
      return `<div><span>${esc(t.nombre)}</span><span>${dd>0?('en '+dd+' d'):'hecho'}</span></div>`}).join('')+
    `</div></div>`;
  document.getElementById('v-hoy').innerHTML=h;
}

// ---------- TAB PLAN ----------
function renderPlan(){
  let h=`<div class="legend">
    <span><i style="background:var(--hard)"></i>Calidad</span>
    <span><i style="background:var(--cool)"></i>Aeróbico</span>
    <span><i style="background:var(--violet)"></i>Test</span>
    <span><i style="background:var(--ok)"></i>Carrera</span>
    <span><i style="background:var(--tx3)"></i>Descanso</span></div>`;
  DATA.semanas.forEach(s=>{
    const esActual=s.dias.some(x=>x.fecha_iso===HOY_ISO);
    const pasada=s.dias.every(x=>x.fecha_iso<HOY_ISO);
    h+=`<details class="wk${esActual?' now':''}"${esActual?' open':''}>
      <summary><div><div class="wkn">Semana ${esc(s.numero)}${pasada?' <span style="color:var(--ok);font-size:11px">✓</span>':''}</div>
      <div class="wkf">${esc(s.fase)}${s.rango?' · '+esc(s.rango):''}</div></div>
      <div class="wkv">${esc(s.volumen)}</div></summary>`;
    s.dias.forEach(x=>{
      h+=`<details class="day${x.fecha_iso===HOY_ISO?' hoy':''}"><summary>
        <span class="dot ${kind(x.tipo)}"></span>
        <span class="dd">${esc((x.dia||'').slice(0,3))} ${esc((x.fecha||'').slice(0,5))}</span>
        <span class="ds">${esc(x.sesion||'—')}</span>${x.hecho?'<span class="chk">✓</span>':''}</summary>
        <div class="dbody"><span class="tag ${kind(x.tipo)}">${esc(x.tipo||'—')}</span>
        ${guiaHTML(x.guia,x)}${registroHTML(x)}</div></details>`;
    });
    h+=`</details>`;
  });
  document.getElementById('v-plan').innerHTML=h;
}

function tab(t){
  document.getElementById('v-hoy').classList.toggle('hide',t!=='hoy');
  document.getElementById('v-plan').classList.toggle('hide',t!=='plan');
  document.getElementById('btn-hoy').classList.toggle('on',t==='hoy');
  document.getElementById('btn-plan').classList.toggle('on',t==='plan');
  try{localStorage.setItem('milla_tab',t)}catch(e){}
  window.scrollTo(0,0);
}
renderHoy(); renderPlan();
try{ const t=localStorage.getItem('milla_tab'); if(t==='plan') tab('plan'); }catch(e){}
</script>
